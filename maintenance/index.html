<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Сайт временно недоступен</title>
  <meta name="theme-color" content="#123c31">
  <link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
  <style>
    @font-face{font-family:Manrope;src:url('/assets/manrope-400.woff2') format('woff2');font-weight:400;font-display:swap}
    @font-face{font-family:Prata;src:url('/assets/prata-400.woff2') format('woff2');font-weight:400;font-display:swap}
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:clamp(24px,6vw,64px);
      background:#123c31;color:#fffdf9;font:400 16px/1.6 Manrope,system-ui,sans-serif;text-align:center}
    .card{max-width:460px}
    img{width:76px;height:76px;margin:0 auto 34px;display:block}
    h1{margin:0 0 18px;font:400 clamp(30px,5vw,42px)/1.15 Prata,Georgia,serif;letter-spacing:-.03em}
    p{margin:0;color:rgba(255,255,255,.72);font-size:15px}
  </style>
</head>
<body>
  <main class="card">
    <img src="/assets/mark.svg" width="76" height="76" alt="">
    <h1>Сайт временно недоступен</h1>
    <p>Идут работы. Зайдите позже.</p>
  </main>
</body>
</html>
